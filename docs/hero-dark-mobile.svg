<svg xmlns="http://www.w3.org/2000/svg" width="320" height="226" viewBox="0 0 320 226" role="img" aria-labelledby="sf50fc59-title sf50fc59-desc" class="sf50fc59-root">
<title id="sf50fc59-title">svg-forge</title>
<desc id="sf50fc59-desc">Claude Code plugin. svg-forge. Animated SVGs that render on GitHub. 23 kinds, any size, any theme. Phone and desktop layouts, contrast checked. Storyboard, generate, validate, ship. v0.4.0. MIT</desc>
<style>.sf50fc59-m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;letter-spacing:1.2px}.sf50fc59-s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:600}.sf50fc59-b{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:800}</style>
<defs><pattern id="sf50fc59-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/></pattern><linearGradient id="sf50fc59-scan" x1="0" x2="1"><stop offset="0" stop-color="#3abef8" stop-opacity="0"/><stop offset="0.5" stop-color="#3abef8" stop-opacity="0.1"/><stop offset="1" stop-color="#3abef8" stop-opacity="0"/></linearGradient><clipPath id="sf50fc59-card"><rect x="1" y="1" width="318" height="224" rx="18"/></clipPath><linearGradient id="sf50fc59-bg" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#0e1a24"/><stop offset="0.6" stop-color="#0b1012"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="319" height="225" rx="18" fill="url(#sf50fc59-bg)" stroke="rgba(255,255,255,0.09)"/>
<g clip-path="url(#sf50fc59-card)"><rect width="320" height="226" fill="url(#sf50fc59-grid)"/><rect x="-200" y="0" width="200" height="226" fill="url(#sf50fc59-scan)"><animateTransform attributeName="transform" type="translate" values="0 0;720 0" keyTimes="0;1" dur="6s" repeatCount="indefinite"/></rect></g>
