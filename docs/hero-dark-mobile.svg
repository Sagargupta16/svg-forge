<text class="sf50fc59-b" x="22" y="78.8" fill="#f3f4f6" font-size="40" letter-spacing="-1">svg-forge</text>
<text class="sf50fc59-s" x="24" fill="rgba(255,255,255,0.74)" font-size="15" y="109.8">Animated SVGs that render<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" repeatCount="indefinite"/></text>
