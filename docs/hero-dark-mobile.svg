<text class="sf50fc59-s" x="24" fill="rgba(255,255,255,0.74)" font-size="15" y="109.8" opacity="0">Phone and desktop layouts,<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.54;0.71;0.75;1" dur="12s" repeatCount="indefinite"/></text>
<text class="sf50fc59-s" x="24" fill="rgba(255,255,255,0.74)" font-size="15" y="109.8" opacity="0">Storyboard, generate,<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.79;0.96;1" dur="12s" repeatCount="indefinite"/></text>
<text class="sf50fc59-s" x="24" fill="rgba(255,255,255,0.74)" font-size="15" y="129.8">on GitHub<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" repeatCount="indefinite"/></text>
