<svg xmlns="http://www.w3.org/2000/svg" width="320" height="226" aria-labelledby="sf4afbc7-title sf4afbc7-desc" class="sf4afbc7-root" role="img" viewBox="0 0 320 226"><title id="sf4afbc7-title">svg-forge</title><desc id="sf4afbc7-desc">Claude Code plugin. svg-forge. Animated SVGs for any page, app or README. 23 kinds, any size, any theme. Phone and desktop layouts, contrast checked. Storyboard, generate, validate, ship. v0.4.0. MIT</desc><style>.sf4afbc7-m{font-family:&apos;JetBrains Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;Liberation Mono&apos;,Menlo,monospace;font-weight:700;letter-spacing:1.2px}.sf4afbc7-b,.sf4afbc7-s{font-family:&apos;Segoe UI&apos;,Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}.sf4afbc7-s{font-weight:600}.sf4afbc7-b{font-weight:800}</style><defs><pattern id="sf4afbc7-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1" d="M24 0H0V24"/></pattern><linearGradient id="sf4afbc7-scan" x1="0" x2="1"><stop offset="0" stop-color="#3abef8" stop-opacity="0"/><stop offset=".5" stop-color="#3abef8" stop-opacity=".1"/><stop offset="1" stop-color="#3abef8" stop-opacity="0"/></linearGradient><clipPath id="sf4afbc7-card"><rect width="318" height="224" x="1" y="1" rx="18"/></clipPath><linearGradient id="sf4afbc7-bg" x1="0" x2=".6" y1="0" y2="1"><stop offset="0" stop-color="#0e1a24"/><stop offset=".6" stop-color="#0b1012"/></linearGradient></defs><rect width="319" height="225" x=".5" y=".5" fill="url(#sf4afbc7-bg)" stroke="rgba(255,255,255,0.09)" rx="18"/><g clip-path="url(#sf4afbc7-card)"><rect width="320" height="226" fill="url(#sf4afbc7-grid)"/><rect width="200" height="226" x="-200" y="0" fill="url(#sf4afbc7-scan)"><animateTransform attributeName="transform" dur="6s" keyTimes="0;1" repeatCount="indefinite" type="translate" values="0 0;720 0"/></rect></g><text x="24" y="34" fill="#3abef8" class="sf4afbc7-m" font-size="11">CLAUDE CODE PLUGIN</text><text x="