efinite" values="0;0;1;1;0"/></text><rect width="92.26" height="28" x="24" y="149.8" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.35)" rx="14"/><circle cx="42" cy="163.8" r="4" fill="#22c55e"><animate attributeName="opacity" dur="1.714s" keyTimes="0;0.5;1" repeatCount="indefinite" values="1;0.35;1"/></circle><text x="54" y="167.8" fill="#22c55e" class="sf4afbc7-m" font-size="10.5" letter-spacing="1">V0.4.0</text><text x="24" y="199.8" fill="rgba(255,255,255,0.52)" class="sf4afbc7-m" font-size="10.5">MIT</text></svg>