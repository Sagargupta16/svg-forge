<text class="sf67b250-b" x="22" y="78.8" fill="#0b1012" font-size="40" letter-spacing="-1">svg-forge</text>
<text class="sf67b250-s" x="24" fill="rgba(11,16,18,0.76)" font-size="15" y="109.8">Animated SVGs for any page, app<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" repeatCount="indefinite"/></text>
<text class="sf67b250-s" x="24" fill="rgba(11,16,18,0.76)" font-size="15" y="109.8" opacity="0">23 kinds, any size, any theme<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.29;0.46;0.5;1" dur="12s" repeatCount="indefinite"/></text>
<text class="sf67b250-s" x="24" fill="rgba(11,16,18,0.76)" font-size="15" y="109.8" opacity="0">Phone and desktop layouts,<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.54;0.71;0.75;1" dur="12s" repeatCount="indefinite"/></text>
<text class="sf67b250-s" x="24" fill="rgba(11,16,18,0.76)" font-size="15" y="109.8" opacity="0">Storyboard, generate,<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.79;0.96;1" dur="12s" repeatCount="indefinite"/></text>
<text class="sf67b250-s" x="24" fill="rgba(11,16,18,0.76)" font-size="15" y="129.8">or README<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" repeatCount="indefinite"/></text>
<text class="sf67b250-s" x="24" fill="rgba(11,16,18,0.76)" font-size="15" y="129.8" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.29;0.46;0.5;1" dur="12s" repeatCount="indefinite"/></text>
<text class="sf67b250-s" x="24" fill="rgba(11,16,18,0.76)" font-size="15" y="129.8" opacity="0">contrast checked<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.54;0.71;0.75;1" dur="12s" repeatCount="indefinite"/></text>
