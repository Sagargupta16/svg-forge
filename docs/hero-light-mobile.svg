<svg xmlns="http://www.w3.org/2000/svg" width="320" height="226" viewBox="0 0 320 226" role="img" aria-labelledby="sf67b250-title sf67b250-desc" class="sf67b250-root">
<title id="sf67b250-title">svg-forge</title>
<desc id="sf67b250-desc">Claude Code plugin. svg-forge. Animated SVGs for any page, app or README. 23 kinds, any size, any theme. Phone and desktop layouts, contrast checked. Storyboard, generate, validate, ship. v0.4.0. MIT</desc>
<style>.sf67b250-m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;letter-spacing:1.2px}.sf67b250-s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:600}.sf67b250-b{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:800}</style>
<defs><pattern id="sf67b250-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(11,16,18,0.05)" stroke-width="1"/></pattern><linearGradient id="sf67b250-scan" x1="0" x2="1"><stop offset="0" stop-color="#0792cf" stop-opacity="0"/><stop offset="0.5" stop-color="#0792cf" stop-opacity="0.1"/><stop offset="1" stop-color="#0792cf" stop-opacity="0"/></linearGradient><clipPath id="sf67b250-card"><rect x="1" y="1" width="318" height="224" rx="18"/></clipPath><linearGradient id="sf67b250-bg" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#eef4fb"/><stop offset="0.6" stop-color="#ffffff"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="319" height="225" rx="18" fill="url(#sf67b250-bg)" stroke="rgba(11,16,18,0.13)"/>
<g clip-path="url(#sf67b250-card)"><rect width="320" height="226" fill="url(#sf67b250-grid)"/><rect x="-200" y="0" width="200" height="226" fill="url(#sf67b250-scan)"><animateTransform attributeName="transform" type="translate" values="0 0;720 0" keyTimes="0;1" dur="6s" repeatCount="indefinite"/></rect></g>
