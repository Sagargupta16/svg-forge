<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-labelledby="sfd16dff-title sfd16dff-desc" class="sfd16dff-root">
<title id="sfd16dff-title">svg-forge</title>
<desc id="sfd16dff-desc">Claude Code plugin. svg-forge. Animated SVGs that render on GitHub. 14 kinds, any size, any theme. Contrast checked on dark and light. Storyboard, generate, validate, ship. v0.2.0. MIT</desc>
<style>.sfd16dff-m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;letter-spacing:1.2px}.sfd16dff-s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:600}.sfd16dff-b{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:800}</style>
<defs><pattern id="sfd16dff-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(11,16,18,0.05)" stroke-width="1"/></pattern><linearGradient id="sfd16dff-scan" x1="0" x2="1"><stop offset="0" stop-color="#0792cf" stop-opacity="0"/><stop offset="0.5" stop-color="#0792cf" stop-opacity="0.1"/><stop offset="1" stop-color="#0792cf" stop-opacity="0"/></linearGradient><clipPath id="sfd16dff-card"><rect x="1" y="1" width="838" height="248" rx="18"/></clipPath><linearGradient id="sfd16dff-bg" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#eef4fb"/><stop offset="0.6" stop-color="#ffffff"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="839" height="249" rx="18" fill="url(#sfd16dff-bg)" stroke="rgba(11,16,18,0.13)"/>
