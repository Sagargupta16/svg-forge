<text class="sfd16dff-s" x="44" y="152" fill="rgba(11,16,18,0.76)" font-size="18" opacity="0">14 kinds, any size, any theme<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.29;0.46;0.5;1" dur="12s" repeatCount="indefinite"/></text>
