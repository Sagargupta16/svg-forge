<text class="sff84c79-r" x="96" y="60.25" fill="#0b1012" font-size="20" opacity="0">A good default is a decision nobody has to make, and nobody has<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3733;0.6267;0.6667;1" dur="15s" repeatCount="indefinite"/></text>
<text class="sff84c79-r" x="96" y="60.25" fill="#0b1012" font-size="20" opacity="0">Every alert should say what broke, who it hurts and what to<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6667;0.7067;0.96;1" dur="15s" repeatCount="indefinite"/></text>
<text class="sff84c79-r" x="96" y="89.25" fill="#0b1012" font-size="20">beats the plan you wrote on Monday.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.2933;0.3333;1" dur="15s" repeatCount="indefinite"/></text>
<text class="sff84c79-r" x="96" y="89.25" fill="#0b1012" font-size="20" opacity="0">to undo.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3733;0.6267;0.6667;1" dur="15s" repeatCount="indefinite"/></text>
