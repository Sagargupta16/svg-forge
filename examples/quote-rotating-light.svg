<title id="sff84c79-title">Quotes</title>
<desc id="sff84c79-desc">Quotes taking turns: Ship the small version first. What people do with it on Tuesday beats the plan you wrote on Monday. (Northwind handbook); A good default is a decision nobody has to make, and nobody has to undo. (Bluefin design notes); Every alert should say what broke, who it hurts and what to try first. (Quartz on-call guide)</desc>
