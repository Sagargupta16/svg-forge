<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="sf6fab50-title sf6fab50-desc" class="sf6fab50-root">
<title id="sf6fab50-title">Loading</title>
<desc id="sf6fab50-desc">Animated three-dot orbit loader</desc>
<style>.sf6fab50-m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;letter-spacing:1.2px}.sf6fab50-s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:600}.sf6fab50-b{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:800}</style>
<circle cx="24" cy="24" r="18" fill="none" stroke="rgba(127,127,127,0.3)" stroke-width="2"/>
<g><animateTransform attributeName="transform" type="rotate" values="0 24 24;360 24 24" keyTimes="0;1" dur="1.2s" repeatCount="indefinite"/><circle cx="24" cy="6" r="3.6" fill="#8a5bf6"/></g>
<g><animateTransform attributeName="transform" type="rotate" values="0 24 24;720 24 24" keyTimes="0;1" dur="1.2s" repeatCount="indefinite"/><circle cx="41.73" cy="27.13" r="2.98" fill="#8a5bf6"/></g>
<g><animateTransform attributeName="transform" type="rotate" values="0 24 24;1080 24 24" keyTimes="0;1" dur="1.2s" repeatCount="indefinite"/><circle cx="8.41" cy="33" r="2.4" fill="#8a5bf6"/></g>
</svg>
