<svg xmlns="http://www.w3.org/2000/svg" width="840" height="160" aria-labelledby="sfa8fce2-title sfa8fce2-desc" class="sfa8fce2-root" role="img" viewBox="0 0 840 160"><title id="sfa8fce2-title">Quotes</title><desc id="sfa8fce2-desc">Quotes taking turns: Ship the small version first. What people do with it on Tuesday beats the plan you wrote on Monday. (Northwind handbook); A good default is a decision nobody has to make, and nobody has to undo. (Bluefin design notes); Every alert should say what broke, who it hurts and what to try first. (Quartz on-call guide)</desc><style>.sfa8fce2-m{font-family:&apos;JetBrains Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;Liberation Mono&apos;,Menlo,monospace;font-weight:700;letter-spacing:1.2px}.sfa8fce2-r{font-family:&apos;Segoe UI&apos;,Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:400}</style><defs><linearGradient id="sfa8fce2-bg" x1="0" x2=".6" y1="0" y2="1"><stop offset="0" stop-color="#0e1a24"/><stop offset=".6" stop-color="#0b1012"/></linearGradient></defs><rect width="839" height="159" x=".5" y=".5" fill="url(#sfa8fce2-bg)" stroke="rgba(255,255,255,0.09)" rx="14"/><path fill="#60a5fa" d="M1 12.5C1 7 4 3 10 1.5l.8 1.9C7.6 4.8 5.8 6.6 5.6 7.6A5 5 0 1 1 1 12.5zM14 12.5C14 7 17 3 23 1.5l.8 1.9C20.6 4.8 18.8 6.6 18.6 7.6A5 5 0 1 1 14 12.5z" transform="translate(28 44.25) scale(2)"/><line x1="96" x2="110" y1="109.75" y2="109.75" stroke="rgba(255,255,255,0.52)" stroke-width="1.5"/><text x="96" y="60.25" fill="#f3f4f6" class="sfa8fce2-r" font-size="20">Ship the small version first. What people do with it on Tuesday<animate attributeName="opacity" dur="15s" keyTimes="0;0.04;0.2933;0.3333;1" repeatCount="indefinite" values="0;1;1;0;0"/></text><text x="96" y="60.25" fill="#f3f4f6" class="sfa8fce2-r" font-size="20" opacity="0">A good default is a decision nobody has to make, and nobody has<animate attributeName="opacity" dur="15s" keyTimes="0;0.3333;0.3733;0.6267;0.6667;1" repeatCount="indefinite" values="0;0;1;1;0;0"/></text><text x="96" y="60.25" fill="#f3f4f6" class="sfa8fce2-r" font-size="20" opacity="0">Every alert should say what broke, who it hurts and what to<animate attributeName="opacity" dur="15s" keyTimes="0;0.6667;0.7067;0.96;1" repeatCount="indefinite" values="0;0;1;1;0"/></text><text x="96" y="89.25" fill="#f3f4f6" class="sfa8fce2-r" font-size="20">beats the plan you wrote on Monday.<animate attributeName="opacity" dur="15s" keyTimes="0;0.04;0.2933;0.3333;1" repeatCount="indefinite" values="0;1;1;0;0"/></text><text x="96" y="89.25" fill="#f3f4f6" class="sfa8fce2-r" font-size="20" opacity="0">to undo.<animate attributeName="opacity" dur="15s" keyTimes="0;0.3333;0.3733;0.6267;0.6667;1" repeatCount="indefinite" values="0;0;1;1;0;0"/></text><text x="96" y="89.25" fill="#f3f4f6" class="sfa8fce2-r" font-size="20" opacity="0">try first.<animate attributeName="opacity" dur="15s" keyTimes="0;0.6667;0.7067;0.96;1" repeatCount="indefinite" values="0;0;1;1;0"/></text><text x="118" y="113.25" fill="rgba(255,255,255,0.52)" class="sfa8fce2-m" font-size="10">NORTHWIND HANDBOOK<animate attributeName="opacity" dur="15s" keyTimes="0;0.04;0.2933;0.3333;1" repeatCount="indefinite" values="0;1;1;0;0"/></text><text x="118" y="113.25" fill="rgba(255,255,255,0.52)" class="sfa8fce2-m" font-size="10" opacity="0">BLUEFIN DESIGN NOTES<animate attributeName="opacity" dur="15s" keyTimes="0;0.3333;0.3733;0.6267;0.6667;1" repeatCount="indefinite" values="0;0;1;1;0;0"/></text><text x="118" y="113.25" fill="rgba(255,255,255,0.52)" class="sfa8fce2-m" font-size="10" opacity="0">QUARTZ ON-CALL GUIDE<animate attributeName="opacity" dur="15s" keyTimes="0;0.6667;0.7067;0.96;1" repeatCount="indefinite" values="0;0;1;1;0"/></text></svg>