<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" role="img">
<style>.lbl{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9ca3af}.num{font:800 30px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e5e7eb}</style>
<rect x="0.5" y="0.5" width="479" height="159" rx="12" fill="#0b1012" stroke="#1f2937"/>
<image href="https://img.shields.io/badge/build-passing-22c55e" x="352" y="18" width="104" height="20"/>
