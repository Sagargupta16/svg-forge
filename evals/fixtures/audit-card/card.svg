  <animate attributeName="opacity" values="0;1" keyTimes="0;1" calcmod="spline" keySplines="0.22 1 0.36 1" dur="0.8s" fill="freeze"/>
  <text class="num" x="24" y="92">1,204</text>
  <text class="lbl" x="24" y="116">commits</text>
  <text class="num" x="184" y="92">87%</text>
